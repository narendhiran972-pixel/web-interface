<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.container{
    width:350px;
    max-width:90%;
    background:#fff;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

h1{
    color:#333;
    margin-bottom:20px;
    letter-spacing:1px;
}

#count{
    font-size:75px;
    font-weight:bold;
    color:#2575fc;
    margin:25px 0;
    transition:0.3s ease;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    width:70px;
    height:60px;
    border:none;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

#increase{
    background:#28a745;
}

#decrease{
    background:#dc3545;
}

button:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

button:active{
    transform:scale(0.95);
}

@media(max-width:500px){
    .container{
        width:90%;
        padding:25px;
    }

    #count{
        font-size:60px;
    }

    button{
        width:60px;
        height:55px;
        font-size:24px;
    }
}
</style>

</head>
<body>

<div class="container">
    <h1>Counter App</h1>

    <div id="count">0</div>

    <div class="buttons">
        <button id="decrease">−</button>
        <button id="increase">+</button>
    </div>
</div>

<script>
let count = 0;

const counter = document.getElementById("count");

document.getElementById("increase").onclick = function(){
    count++;
    updateCounter();
};

document.getElementById("decrease").onclick = function(){
    count--;
    updateCounter();
};

function updateCounter(){
    counter.innerHTML = count;

    if(count > 0){
        counter.style.color = "#28a745";
    }
    else if(count < 0){
        counter.style.color = "#dc3545";
    }
    else{
        counter.style.color = "#2575fc";
    }
}
</script>

</body>
</html>
