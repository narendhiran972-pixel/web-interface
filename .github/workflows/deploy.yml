              }


              .hero h1 {

                font-size:
                  clamp(
                    45px,
                    7vw,
                    78px
                  );

                line-height: 1;

                letter-spacing: -4px;

                font-weight: 950;

                margin-bottom: 22px;

                background:
                  linear-gradient(
                    90deg,
                    #ffffff 5%,
                    #c4b5fd 35%,
                    #f9a8d4 65%,
                    #67e8f9 95%
                  );

                -webkit-background-clip:
                  text;

                background-clip:
                  text;

                color:
