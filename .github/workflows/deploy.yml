            <script>

              const searchInput =
                document.getElementById(
                  "searchInput"
                );


              const cards =
                document.querySelectorAll(
                  ".card"
                );


              const noResults =
                document.getElementById(
                  "noResults"
                );


              searchInput.addEventListener(
                "input",
                function () {

                  const query =
                    this.value
                      .toLowerCase()
                      .trim();


                  let visible =
                    0;


                  cards.forEach(
                    function (card) {

                      const name =
                        card
                          .getAttribute(
                            "data-name"
                          )
                          .toLowerCase();


                      if (
                        name.includes(query)
                      ) {

                        card.style.display =
                          "block";

                        visible++;

                      }

                      else {

                        card.style.display =
                          "none";

                      }

                    }
                  );


                  if (
                    visible === 0
                  ) {

                    noResults.style.display =
                      "block";

                  }

                  else {

                    noResults.style.display =
                      "none";

                  }

                }
              );

            </script>


