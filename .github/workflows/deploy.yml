              }


              .hero-text {

                max-width: 680px;

                margin: auto;

                color: #aab3c7;

                font-size: 16px;

                line-height: 1.7;

              }


              /* =========================================
                 STATS
              ========================================= */

              .stats {

                display: grid;

                grid-template-columns:
                  repeat(3, 1fr);

                gap: 16px;

                margin-bottom: 35px;

              }


              .stat-card {

                padding: 20px;

                text-align: center;

                border-radius: 18px;

                border:
                  1px solid
                  rgba(255,255,255,0.09);

                background:
