                backdrop-filter:
                  blur(15px);

              }


              .stat-number {

                display: block;

                font-size: 27px;

                font-weight: 950;

                margin-bottom: 5px;

                background:
                  linear-gradient(
                    90deg,
                    #a78bfa,
                    #f472b6
