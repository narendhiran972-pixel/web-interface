name: Deploy All Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- Create final Pages folder ----------
      - name: Create deployment folder
        run: |
          mkdir -p dist

      # ---------- Project 1: Counter App ----------
      - name: Copy Counter App
        run: |
          mkdir -p dist/counterapp
          cp "unti 1/counterapp/counterapp.html" dist/counterapp/index.html

      # ---------- Project 2: Student Profile ----------
      - name: Copy Student Profile
        run: |
          mkdir -p dist/student-profile
          cp "unti 1/project 2/Student Profile Card.html" dist/student-profile/index.html

      # ---------- Project 3: Hobby Pro ----------
      - name: Build Hobby Pro
        working-directory: unti 2/hobby pro
        run: |
          npm ci
          npm run build

      - name: Copy Hobby Pro
        run: |
          mkdir -p dist/hobby-pro
          cp -r "unti 2/hobby pro/dist/." dist/hobby-pro/

      # ---------- Project 4: Student Pro ----------
      - name: Build Student Pro
        working-directory: unti 2/student pro
        run: |
          rm -rf node_modules
          npm install
          npm run build

      - name: Copy Student Pro
        run: |
          mkdir -p dist/student-pro
          cp -r "unti 2/student pro/build/." dist/student-pro/

      # ---------- Project 5: Unit 3 ----------
      - name: Build Unit 3
        working-directory: unit3
        run: |
          npm ci
          npm run build

      - name: Copy Unit 3
        run: |
          mkdir -p dist/unit3
          cp -r unit3/dist/. dist/unit3/

      # ---------- Project 6: Unti 4 ----------
      - name: Build Unti 4
        working-directory: unti4
        run: |
          npm ci
          npm run build

      - name: Copy Unti 4
        run: |
          mkdir -p dist/unti4
          cp -r unti4/dist/. dist/unti4/

      # ---------- Project 7: Router Demo ----------
      - name: Build Router Demo
        working-directory: unti4/uint 5 web pro/router-demo
        run: |
          rm -rf node_modules
          npm install
          npm run build

      - name: Copy Router Demo
        run: |
          mkdir -p dist/router-demo
          cp -r "unti4/uint 5 web pro/router-demo/build/." dist/router-demo/

      # ---------- Project 8: Main Unti 5 ----------
      - name: Copy Unti 5 Website
        run: |
          mkdir -p dist/unti5
          cp "unti 5/index.html" dist/unti5/
          cp "unti 5/style.css" dist/unti5/
          cp "unti 5/app.js" dist/unti5/

      # ---------- Project 9: Report Card ----------
      - name: Build Report Card
        working-directory: unti 5/unti 5 report card/report-card-portal
        run: |
          npm ci
          npm run build

      - name: Copy Report Card
        run: |
          mkdir -p dist/report-card
          cp -r "unti 5/unti 5 report card/report-card-portal/dist/." dist/report-card/

      # ---------- Premium Dashboard ----------
      - name: Create Dashboard
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <meta
              name="theme-color"
              content="#070b1f"
            >

            <title>
              Narendhiran | Projects Portfolio
            </title>

            <style>

              /* =========================================
                 RESET
              ========================================= */

              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }

              html {
                scroll-behavior: smooth;
              }

              body {

                font-family:
                  Inter,
                  "Segoe UI",
                  Arial,
                  sans-serif;

                min-height: 100vh;

                color: #ffffff;

                background:
                  radial-gradient(
                    circle at 10% 10%,
                    rgba(99, 102, 241, 0.28),
                    transparent 30%
                  ),

                  radial-gradient(
                    circle at 90% 15%,
                    rgba(236, 72, 153, 0.24),
                    transparent 30%
                  ),

                  radial-gradient(
                    circle at 50% 100%,
                    rgba(6, 182, 212, 0.22),
                    transparent 35%
                  ),

                  linear-gradient(
                    135deg,
                    #050816,
                    #0b1026,
                    #111936
                  );

                overflow-x: hidden;

              }


              /* =========================================
                 ANIMATED BACKGROUND
              ========================================= */

              .background {

                position: fixed;

                inset: 0;

                overflow: hidden;

                pointer-events: none;

                z-index: -1;

              }


              .orb {

                position: absolute;

                width: 350px;

                height: 350px;

                border-radius: 50%;

                filter: blur(100px);

                opacity: 0.25;

                animation:
                  floating 12s ease-in-out infinite;

              }


              .orb-one {

                background: #7c3aed;

                top: -160px;

                left: -120px;

              }


              .orb-two {

                background: #ec4899;

                right: -150px;

                top: 30%;

                animation-delay: 3s;

              }


              .orb-three {

                background: #06b6d4;

                left: 35%;

                bottom: -180px;

                animation-delay: 6s;

              }


              @keyframes floating {

                0%,
                100% {

                  transform:
                    translate(0, 0)
                    scale(1);

                }

                50% {

                  transform:
                    translate(35px, -25px)
                    scale(1.08);

                }

              }


              /* =========================================
                 CONTAINER
              ========================================= */

              .container {

                width:
                  min(
                    1180px,
                    calc(100% - 36px)
                  );

                margin: auto;

                padding:
                  25px 0 55px;

              }


              /* =========================================
                 NAVBAR
              ========================================= */

              .navbar {

                display: flex;

                justify-content:
                  space-between;

                align-items: center;

                padding:
                  13px 16px;

                margin-bottom: 45px;

                border:
                  1px solid
                  rgba(255,255,255,0.12);

                border-radius: 18px;

                background:
                  rgba(255,255,255,0.055);

                backdrop-filter:
                  blur(20px);

                -webkit-backdrop-filter:
                  blur(20px);

                box-shadow:
                  0 20px 60px
                  rgba(0,0,0,0.25);

              }


              .brand {

                display: flex;

                align-items: center;

                gap: 12px;

              }


              .brand-logo {

                width: 45px;

                height: 45px;

                display: grid;

                place-items: center;

                border-radius: 14px;

                font-size: 16px;

                font-weight: 900;

                background:
                  linear-gradient(
                    135deg,
                    #6366f1,
                    #a855f7,
                    #ec4899
                  );

                box-shadow:
                  0 10px 30px
                  rgba(139,92,246,0.40);

              }


              .brand-name {

                font-weight: 800;

                font-size: 15px;

                color: #e8eaf2;

              }


              .github-button {

                display: inline-flex;

                align-items: center;

                gap: 8px;

                text-decoration: none;

                color: white;

                padding:
                  10px 16px;

                border-radius: 12px;

                font-size: 13px;

                font-weight: 800;

                background:
                  rgba(255,255,255,0.07);

                border:
                  1px solid
                  rgba(255,255,255,0.14);

                transition:
                  0.25s ease;

              }


              .github-button:hover {

                transform:
                  translateY(-3px);

                background:
                  rgba(255,255,255,0.13);

                border-color:
                  rgba(255,255,255,0.28);

              }


              /* =========================================
                 HERO
              ========================================= */

              .hero {

                text-align: center;

                padding:
                  20px 0 40px;

              }


              .live-badge {

                display: inline-flex;

                align-items: center;

                gap: 8px;

                padding:
                  8px 14px;

                border-radius: 999px;

                color: #c4b5fd;

                font-size: 12px;

                font-weight: 800;

                background:
                  rgba(139,92,246,0.12);

                border:
                  1px solid
                  rgba(139,92,246,0.28);

                margin-bottom: 22px;

              }


              .live-dot {

                width: 8px;

                height: 8px;

                border-radius: 50%;

                background: #22c55e;

                box-shadow:
                  0 0 15px
