                align-items: center;

                gap: 20px;

                margin-bottom: 22px;

              }


              .section-title {

                font-size: 25px;

                font-weight: 900;

                letter-spacing: -0.5px;

              }


              .section-subtitle {

                color: #707b92;

                font-size: 12px;

                margin-top: 4px;

              }


              /* =========================================
                 SEARCH
              ========================================= */

              .search {

                width:
                  min(
                    320px,
                    100%
                  );

              }


              .search input {

                width: 100%;

                padding:
                  13px 16px;

                outline: none;

                border-radius: 13px;

                border:
                  1px solid
                  rgba(255,255,255,0.10);

                color: white;

                background:
                  rgba(255,255,255,0.055);

                font-size: 13px;

                transition:
                  0.25s ease;

              }


              .search input::placeholder {

                color: #68748a;

              }


              .search input:focus {

                border-color:
                  rgba(139,92,246,0.65);

                box-shadow:
                  0 0 0 4px
                  rgba(139,92,246,0.10);

              }


              /* =========================================
                 PROJECT GRID
              ========================================= */

              .projects {

                display: grid;

                grid-template-columns:
                  repeat(
                    3,
                    minmax(0, 1fr)
                  );

                gap: 20px;

              }


              /* =========================================
                 CARD
              ========================================= */

              .card {

                position: relative;

                overflow: hidden;

                min-height: 255px;

                padding: 25px;

                border-radius: 22px;

                border:
                  1px solid
                  rgba(255,255,255,0.10);

                background:
                  linear-gradient(
                    145deg,
                    rgba(255,255,255,0.095),
                    rgba(255,255,255,0.035)
                  );

                backdrop-filter:
                  blur(18px);

                -webkit-backdrop-filter:
                  blur(18px);

                box-shadow:
                  0 18px 55px
                  rgba(0,0,0,0.22);

                transition:
                  transform 0.35s ease,
                  border-color 0.35s ease,
                  box-shadow 0.35s ease;

              }


              .card::before {

                content: "";

                position: absolute;

                top: 0;

                left: 0;

                width: 100%;

                height: 4px;

                background:
                  var(--accent);

              }


              .card::after {

                content: "";

                position: absolute;

                width: 150px;

                height: 150px;

                right: -75px;

                top: -75px;

                border-radius: 50%;

                background:
                  var(--accent);

                opacity: 0.12;

                filter: blur(15px);

                transition:
                  0.4s ease;

              }


              .card:hover {

                transform:
                  translateY(-9px);

                border-color:
                  var(--accent);

                box-shadow:
                  0 25px 70px
                  rgba(0,0,0,0.32);

              }


              .card:hover::after {

                transform:
                  scale(1.5);

                opacity: 0.18;

              }


              /* =========================================
                 PROJECT ICON
              ========================================= */

              .icon {

                width: 55px;

                height: 55px;

                display: grid;

                place-items: center;

                border-radius: 16px;

                font-size: 25px;

                margin-bottom: 20px;

                background:
                  rgba(255,255,255,0.07);

                border:
                  1px solid
                  var(--accent);

                box-shadow:
                  0 8px 25px
                  rgba(0,0,0,0.18);

                transition:
                  0.3s ease;

              }


              .card:hover .icon {

                transform:
                  rotate(-6deg)
                  scale(1.08);

              }


              .card h2 {

                font-size: 20px;

                font-weight: 900;

                margin-bottom: 9px;

                letter-spacing:
                  -0.3px;

              }


              .card p {

                color: #939db1;

                font-size: 13px;

                line-height: 1.6;

                min-height: 44px;

                margin-bottom: 22px;

              }


              /* =========================================
                 OPEN BUTTON
              ========================================= */

              .open-btn {

                width: 100%;

                display: flex;

                align-items: center;

                justify-content:
                  space-between;

                text-decoration: none;

                color: white;

                padding:
                  11px 14px;

                border-radius: 12px;

                font-size: 12px;

                font-weight: 850;

                background:
                  linear-gradient(
                    135deg,
                    var(--accent),
                    rgba(255,255,255,0.16)
                  );

                border:
                  1px solid
                  rgba(255,255,255,0.12);

                transition:
                  0.25s ease;

              }


              .open-btn:hover {

                transform:
                  translateY(-2px);

                filter:
                  brightness(1.12);

              }


              .arrow {

                font-size: 18px;

                transition:
                  0.25s ease;

              }


              .open-btn:hover .arrow {

                transform:
                  translateX(5px);

              }


              /* =========================================
                 EMPTY SEARCH
              ========================================= */

              .no-results {

                display: none;

                text-align: center;

                padding: 55px 20px;

                color: #758097;

              }


              /* =========================================
                 FOOTER
              ========================================= */

              footer {

                text-align: center;

                margin-top: 55px;

                padding-top: 25px;

                border-top:
                  1px solid
                  rgba(255,255,255,0.07);

                color: #68748a;

                font-size: 12px;

                line-height: 1.8;

              }


              footer strong {

                color: #b8c1d3;

              }


              /* =========================================
                 RESPONSIVE
              ========================================= */

              @media (max-width: 950px) {

                .projects {

                  grid-template-columns:
                    repeat(
                      2,
                      minmax(0, 1fr)
                    );

                }

              }


              @media (max-width: 700px) {

                .container {

                  width:
                    calc(100% - 24px);

                  padding-top: 15px;

                }


                .navbar {

                  margin-bottom: 30px;

                }


                .hero {

                  padding:
                    15px 0 35px;

                }


                .hero h1 {

                  letter-spacing:
                    -2.5px;

                }


                .stats {

                  gap: 8px;

                }


                .stat-card {

                  padding:
                    15px 7px;

                }


                .stat-number {

                  font-size: 21px;

                }


                .stat-label {

                  font-size: 10px;

                }


                .section-header {

                  flex-direction:
                    column;

                  align-items:
                    stretch;

                }


                .search {

                  width: 100%;

                }


                .projects {

                  grid-template-columns:
                    1fr;

                }

              }


              @media (max-width: 430px) {

                .brand-name {

                  display: none;

                }


                .github-button {

                  padding:
                    9px 12px;

                }


                .hero h1 {

                  font-size: 43px;

                }

              }

            </style>

